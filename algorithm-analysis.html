<body><header><a class="brand" href="index.html">CS Knowledge</a></header>
<main class="structures-page array-page analysis-page"><nav class="breadcrumb" aria-label="현재 위치"><a href="index.html">과목 목록</a><span>/</span><a href="algorithms.html">알고리즘</a><span>/</span><span aria-current="page">알고리즘 분석 기초</span></nav><div class="subject-intro"><p class="subject-label">ALGORITHMS / ALGORITHM ANALYSIS</p><h1>알고리즘 분석 기초 <span class="english-title">Algorithm Analysis</span></h1><p>입력 크기에 따른 연산량과 메모리 증가 추세</p></div>
<div class="array-tabs" role="tablist" aria-label="분석 기초 학습 항목"><button id="tab-time" role="tab" data-mode="time" aria-controls="lesson-panel">시간 복잡도</button><button id="tab-space" role="tab" data-mode="space" aria-controls="lesson-panel">공간 복잡도</button><button id="tab-bounds" role="tab" data-mode="bounds" aria-controls="lesson-panel">O · Ω · Θ 표기법</button><button id="tab-compare" role="tab" data-mode="compare" aria-controls="lesson-panel">비교 및 적용</button></div>
<section id="lesson-panel" role="tabpanel" tabindex="0"><div class="array-concept"><h2 id="concept-title"></h2><p id="concept-description"></p></div><div id="analysis-stage" class="array-visual"><div id="analysis-visual-heading" class="visual-heading"><span>INPUT & COST</span><button id="analysis-run" class="reset-button" type="button">시작</button></div><div id="analysis-visual" class="analysis-visual"></div><div id="analysis-metrics" class="array-meta" aria-live="polite"></div></div>
<form id="analysis-form" class="array-controls"><label>입력 크기 n <input id="analysis-n" type="number" min="2" max="16" step="1" value="8" required></label><label id="example-field">예제 <select id="analysis-example"></select></label></form><p id="analysis-error" class="tree-error" role="alert"></p>
